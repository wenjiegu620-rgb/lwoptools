async function loadDeliveryData() {
  try {
    const res = await fetch('/api/delivery/data');
    if (res.status === 401) { window.location.href = '/'; return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    _deliveryData = json.projects || {};
    const refreshing = json.refreshing;
    renderDeliveryCards();
    updateDeliveryRefreshingTip(refreshing);

    // 如果所有项目都没有数据，说明还在初次加载
    const hasAny = Object.values(_deliveryData).some(p => p.data);
    if (!hasAny || refreshing) {
      if (!_deliveryPollTimer) {
        _deliveryPollTimer = setInterval(() => {
          fetch('/api/delivery/data').then(r => r.json()).then(j => {
            _deliveryData = j.projects || {};
            renderDeliveryCards();
            updateDeliveryRefreshingTip(j.refreshing);
            if (!j.refreshing && Object.values(_deliveryData).some(p => p.data)) {
              clearInterval(_deliveryPollTimer);
              _deliveryPollTimer = null;
            }
          });
        }, 30000);
      }
    }
  } catch(e) {
    document.getElementById('deliveryEmpty').style.display = '';
    document.getElementById('deliveryEmpty').querySelector('div:last-child').textContent = '加载失败: ' + e.message;
    document.getElementById('deliveryCards').innerHTML = '';
  }
}

function updateDeliveryRefreshingTip(refreshing) {
  document.getElementById('deliveryRefreshingTip').style.display = refreshing ? '' : 'none';
  document.getElementById('deliveryRefreshBtn').disabled = refreshing;
}

function _dedupDesc(cfg) {
  if (!cfg.dedup_by_producer_scene) return null;
  const mode = cfg.dedup_mode === 'task' ? '同 task 去重' : '同 task + 采集员去重';
  const cap = cfg.dedup_task_cap_hours != null ? `，单条 task 上限 ${cfg.dedup_task_cap_hours}h` : '';
  return mode + cap;
}

function renderDeliveryCards() {
  const container = document.getElementById('deliveryCards');
  const empty = document.getElementById('deliveryEmpty');
  const entries = Object.entries(_deliveryData);
  if (!entries.length) { empty.style.display = ''; container.innerHTML = ''; return; }

  const hasData = entries.some(([,p]) => p.data);
  if (!hasData) {
    empty.style.display = '';
    container.innerHTML = '';
    document.getElementById('deliveryUpdatedAt').textContent = '首次加载中，约需 10 分钟…';
    return;
  }
  empty.style.display = 'none';

  const useDedup = document.getElementById('deliveryDedupToggle')?.checked;

  // 找最早更新时间
  const times = entries.map(([,p]) => p.updated_at).filter(Boolean);
  if (times.length) document.getElementById('deliveryUpdatedAt').textContent = '更新于 ' + times[0];

  container.innerHTML = entries.map(([name, proj]) => {
    const cfg = proj.config || {};
    const data = proj.data;
    if (!data) return `
      <div class="dv-card" onclick="expandDelivery('${name}')">
        <div class="dv-card-name">${cfg.display_name || name}</div>
        <div style="color:#64748b;font-size:12px;margin-top:8px">数据加载中…</div>
      </div>`;

    const knownData = data.projects?.[name]?.known || {};
    const hasDedup = !!(knownData.packed_dedup);

    // 原始数据
    const sumH = obj => Object.values(obj || {}).reduce((s, v) => s + (v.hours || 0), 0);
    const qcH    = sumH(knownData.qc_pass);
    const labH   = sumH(knownData.lab_done);
    const packedH = sumH(knownData.packed);
    const diH    = cfg.show_deliver_inspect ? sumH(knownData.deliver_inspect) : null;

    // 去重数据
    const qcDH   = hasDedup ? sumH(knownData.qc_pass_dedup)  : null;
    const labDH  = hasDedup ? sumH(knownData.lab_done_dedup) : null;
    const pkDH   = hasDedup ? sumH(knownData.packed_dedup)   : null;
    const diDH   = (hasDedup && cfg.show_deliver_inspect && knownData.deliver_inspect_dedup)
                   ? sumH(knownData.deliver_inspect_dedup) : null;

    // 进度条用打包（去重优先）
    const packedForBar = pkDH !== null ? pkDH : packedH;
    const targetH = cfg.base_total_hours || 0;
    const pct = targetH > 0 ? Math.min(100, packedForBar / targetH * 100) : null;

    // 去重规则 tooltip
    const dedupDesc = _dedupDesc(cfg);

    // 交付日期剩余天数
    const delivDate = cfg.delivery_date && cfg.delivery_date !== '待定' ? cfg.delivery_date : null;
    let daysLeft = null, daysColor = '#94a3b8';
    if (delivDate) {
      daysLeft = Math.ceil((new Date(delivDate) - new Date()) / 86400000);
      daysColor = daysLeft <= 3 ? '#ef4444' : daysLeft <= 7 ? '#f59e0b' : '#34d399';
    }

    const progressBar = pct !== null ? `
      <div style="margin:10px 0 4px;background:#0f172a;border-radius:4px;height:6px;overflow:hidden">
        <div style="width:${pct.toFixed(1)}%;height:100%;background:${pct>=80?'#34d399':pct>=50?'#f59e0b':'#3b82f6'};border-radius:4px"></div>
      </div>
      <div style="font-size:11px;color:#94a3b8">${packedForBar.toFixed(1)}h / ${targetH}h（${pct.toFixed(1)}%）${hasDedup ? '<span style="color:#818cf8;margin-left:4px" title="'+dedupDesc+'">去重</span>' : ''}</div>
    ` : `<div style="font-size:11px;color:#64748b;margin-top:6px">无目标时长</div>`;

    // 每个指标列：原始值在上，去重值在下（有分隔线），dedupH=null 则只显示一行
    const mkCell = (rawH, dedupH, color, label) => {
      if (dedupH !== null) {
        return `<div style="text-align:center;flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;color:${color}">${rawH.toFixed(0)}h</div>
            <div style="font-size:10px;color:#64748b;white-space:nowrap">${label}</div>
            <div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(99,102,241,.15)">
              <div style="font-size:14px;font-weight:600;color:${color}">${dedupH.toFixed(0)}h</div>
              <div style="font-size:10px;color:#64748b;white-space:nowrap">${label}(去重)</div>
            </div>
          </div>`;
      }
      return `<div style="text-align:center;flex:1;min-width:0">
            <div style="font-size:14px;font-weight:600;color:${color}">${rawH.toFixed(0)}h</div>
            <div style="font-size:10px;color:#64748b;white-space:nowrap">${label}</div>
          </div>`;
    };

    const diCell = diH !== null ? mkCell(diH, diDH, '#fb923c', '交付质检') : '';

    return `
      <div class="dv-card" onclick="expandDelivery('${name}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div class="dv-card-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px">${cfg.display_name || name}</div>
          ${daysLeft !== null ? `<div style="font-size:12px;color:${daysColor};font-weight:600;white-space:nowrap;margin-left:6px">${daysLeft > 0 ? daysLeft+'天后交付' : daysLeft === 0 ? '今日交付' : '已逾期'+Math.abs(daysLeft)+'天'}</div>` : ''}
        </div>
        ${progressBar}
        <div style="display:flex;gap:0;margin-top:10px;justify-content:space-between">
          ${mkCell(qcH, qcDH, '#38bdf8', '抽检通过')}
          ${mkCell(labH, labDH, '#a78bfa', '标注完成')}
          ${mkCell(packedH, pkDH, '#34d399', '打包成功')}
          ${diCell}
        </div>
      </div>`;
  }).join('');
}

function expandDelivery(name) {
  const proj = _deliveryData[name];
  if (!proj || !proj.data) return;
  const cfg = proj.config || {};
  const knownData = proj.data.projects?.[name]?.known || {};
  const unknown = proj.data.projects?.[name]?.unknown || {};
  const scenes = cfg.scenes || [];
  const sceneNames = scenes.map(s => s.name);
  const useDedup = document.getElementById('deliveryDedupToggle')?.checked;
  const hasDedup = !!(knownData.packed_dedup);
  const pk = (useDedup && knownData.packed_dedup)   ? 'packed_dedup'   : 'packed';
  const qk = (useDedup && knownData.qc_pass_dedup)  ? 'qc_pass_dedup'  : 'qc_pass';
  const lk = (useDedup && knownData.lab_done_dedup) ? 'lab_done_dedup' : 'lab_done';

  // 去重说明条
  const dedupDesc = _dedupDesc(cfg);
  const dedupInfoBar = (useDedup && hasDedup && dedupDesc)
    ? `<div style="margin-bottom:10px;padding:6px 12px;background:rgba(99,102,241,.1);border-radius:6px;font-size:12px;color:#818cf8">去重规则：${dedupDesc}</div>`
    : '';

  // 所有已知环境
  const allEnvs = new Set();
  [pk,'sem_ing','sem_done','pose_ing','pose_done',lk,'qc_scene',qk].forEach(k => Object.keys(knownData[k]||{}).forEach(e => allEnvs.add(e)));

  // 一、交付进度统计
  const hc = (k, env) => {
    const d = knownData[k]?.[env] || {};
    const h = (d.hours || 0).toFixed(1);
    const c = d.cnt || 0;
    return `${h}h <span style="color:#64748b;font-size:11px">(${c}条)</span>`;
  };
  let progressRows = '';
  for (const env of allEnvs) {
    const pkH   = (knownData[pk]?.[env]?.hours || 0).toFixed(1);
    const scene = scenes.find(s => s.name === env);
    const targetH = scene?.target_hours || null;
    const pct = targetH ? (parseFloat(pkH)/targetH*100).toFixed(1)+'%' : '—';
    const tgtStr = targetH ? targetH+'h' : '—';
    progressRows += `<tr>
      <td>${env}</td>
      <td>${hc(qk, env)}</td>
      <td>${hc('pose_ing', env)}</td>
      <td>${hc('pose_done', env)}</td>
      <td>${hc('sem_ing', env)}</td>
      <td>${hc('sem_done', env)}</td>
      <td>${hc(lk, env)}</td>
      <td>${hc(pk, env)}</td>
      <td>${tgtStr}</td>
      <td style="color:${parseFloat(pct)>=80?'#34d399':parseFloat(pct)>=50?'#f59e0b':'#e2e8f0'}">${pct}</td>
    </tr>`;
  }

  // 二、质检统计
  let qcRows = '';
  for (const env of allEnvs) {
    const qs = knownData.qc_scene?.[env] || {};
    const inspH = (qs.pending_inspect_h||0).toFixed(1);
    const sampH = (qs.pending_sampling_h||0).toFixed(1);
    const inspCnt = qs.pending_inspect_cnt || 0;
    const sampCnt = qs.pending_sampling_cnt || 0;
    const pass = qs.pass || 0;
    const fail = qs.fail || 0;
    const passH = (qs.pass_h || 0).toFixed(1);
    const failH = (qs.fail_h || 0).toFixed(1);
    const total = pass + fail;
    const rate = total > 0 ? (pass/total*100).toFixed(1)+'%' : '—';
    qcRows += `<tr>
      <td>${env}</td>
      <td>${inspH}h <span style="color:#64748b;font-size:11px">(${inspCnt}条)</span></td>
      <td>${sampH}h <span style="color:#64748b;font-size:11px">(${sampCnt}条)</span></td>
      <td>${passH}h <span style="color:#64748b;font-size:11px">(${pass}条)</span></td>
      <td>${failH}h <span style="color:#64748b;font-size:11px">(${fail}条)</span></td>
      <td style="color:${parseFloat(rate)>=80?'#34d399':parseFloat(rate)>=60?'#f59e0b':'#ef4444'}">${rate}</td>
    </tr>`;
  }

  const unknownWarn = Object.keys(unknown).length ? `
    <div style="margin-top:12px;padding:10px 14px;background:#1e293b;border-radius:8px;border-left:3px solid #f59e0b;font-size:12px;color:#94a3b8">
      ⚠️ 未识别环境（未纳入统计）：${Object.entries(unknown).map(([k,v])=>`${k}(${(v.hours||0).toFixed(1)}h)`).join('、')}
    </div>` : '';

  const tblStyle = 'width:100%;border-collapse:collapse;font-size:13px;margin-top:8px';
  const thStyle = 'padding:8px 10px;text-align:left;color:#64748b;font-weight:500;font-size:12px;background:rgba(99,102,241,.06);';
  const tdStyle = 'padding:7px 10px;border-bottom:1px solid rgba(99,102,241,.08);color:#e2e8f0';

  document.getElementById('deliveryDetailTitle').textContent = cfg.display_name || name;
  document.getElementById('deliveryDetailContent').innerHTML = `
    ${dedupInfoBar}
    <div style="font-size:13px;font-weight:500;color:#94a3b8;margin-bottom:6px">一、交付进度统计</div>
    <table style="${tblStyle}">
      <thead><tr>
        <th style="${thStyle}">环境</th><th style="${thStyle}">质检通过</th>
        <th style="${thStyle}">手势标注中</th><th style="${thStyle}">手势标注完成</th>
        <th style="${thStyle}">语义标注中</th><th style="${thStyle}">语义标注完成</th>
        <th style="${thStyle}">标注完成</th><th style="${thStyle}">打包成功</th>
        <th style="${thStyle}">目标</th><th style="${thStyle}">进度</th>
      </tr></thead>
      <tbody id="dvProgressBody">${progressRows.replace(/padding:[^;]+;/g, tdStyle.replace('padding:7px 10px;',''))}</tbody>
    </table>
    <div style="font-size:13px;font-weight:500;color:#94a3b8;margin:18px 0 6px">二、质检统计</div>
    <table style="${tblStyle}">
      <thead><tr>
        <th style="${thStyle}">环境</th><th style="${thStyle}">待质检</th><th style="${thStyle}">待抽检</th>
        <th style="${thStyle}">质检通过</th><th style="${thStyle}">质检失败</th><th style="${thStyle}">质检通过率</th>
      </tr></thead>
      <tbody>${qcRows.replace(/padding:[^;]+;/g, tdStyle.replace('padding:7px 10px;',''))}</tbody>
    </table>
    ${unknownWarn}
    <div style="font-size:13px;font-weight:500;color:#94a3b8;margin:18px 0 10px">三、每日趋势</div>
    <div id="dvLabChart"></div>
  `;

  // 折线图（3条线）
  const labDaily     = knownData.lab_done_daily     || [];
  const collectDaily = knownData.collect_done_daily || [];
  const qcDaily      = knownData.qc_pass_daily      || [];
  renderLabDailyChart(collectDaily, qcDaily, labDaily);

  // 重新应用 td 样式（简化处理：直接用 CSS）
  document.getElementById('deliveryDetail').querySelectorAll('td').forEach(td => {
    td.style.padding = '7px 10px';
    td.style.borderBottom = '1px solid rgba(99,102,241,.08)';
    if (!td.style.color) td.style.color = '#e2e8f0';
  });

  document.getElementById('deliveryDetail').style.display = '';
  document.getElementById('deliveryDetail').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderLabDailyChart(collectData, qcData, labData) {
  const el = document.getElementById('dvLabChart');
  if (!el) return;

  const series = [
    { data: collectData || [], color: '#38bdf8', label: '采集完成' },
    { data: qcData      || [], color: '#34d399', label: '质检通过' },
    { data: labData     || [], color: '#a78bfa', label: '标注完成' },
  ].filter(s => s.data.length);

  if (!series.length) {
    el.innerHTML = '<div style="color:#475569;font-size:12px;padding:16px 0">暂无数据</div>';
    return;
  }

  const allDates = [...new Set(series.flatMap(s => s.data.map(d => d.date)))].sort();

  const savedRange = localStorage.getItem('dvDailyRange') || '7';
  const range = savedRange;

  const cutoff = range === 'all' ? null : (() => {
    const d = new Date(); d.setDate(d.getDate() - (parseInt(range) - 1));
    return d.toISOString().slice(0, 10);
  })();
  const visibleDates = cutoff ? allDates.filter(d => d >= cutoff) : allDates;

  const thStyle = 'padding:5px 12px;font-size:11px;font-weight:500;text-align:center;border-bottom:1px solid rgba(99,102,241,.15);white-space:nowrap';
  const tdBase  = 'padding:4px 12px;font-size:12px;text-align:center;border-bottom:1px solid rgba(99,102,241,.06);white-space:nowrap;font-variant-numeric:tabular-nums';

  const headers = series.map(s =>
    `<th style="${thStyle};color:${s.color}">${s.label}</th>
     <th style="${thStyle};color:${s.color};opacity:.6">累计</th>`
  ).join('');

  // 预计算每个 series 的累计值（按 allDates 顺序）
  const cumMap = series.map(({ data }) => {
    let cum = 0;
    const m = {};
    allDates.forEach(date => {
      const row = data.find(d => d.date === date);
      if (row) cum += row.hours;
      m[date] = cum;
    });
    return m;
  });

  const rows = visibleDates.map(date => {
    const cells = series.map(({ data }, i) => {
      const row = data.find(d => d.date === date);
      const daily = row
        ? `<td style="${tdBase};color:#e2e8f0">${row.hours.toFixed(1)}h <span style="color:#64748b;font-size:11px">${row.cnt}条</span></td>`
        : `<td style="${tdBase};color:#334155">—</td>`;
      const cum = `<td style="${tdBase};color:#64748b">${cumMap[i][date].toFixed(1)}h</td>`;
      return daily + cum;
    }).join('');
    return `<tr><td style="${tdBase};color:#94a3b8;font-size:11px">${date}</td>${cells}</tr>`;
  }).join('');

  const btnStyle = (val) => `cursor:pointer;padding:2px 10px;border-radius:4px;font-size:11px;border:1px solid rgba(99,102,241,.3);
    background:${range===val?'rgba(99,102,241,.25)':'transparent'};color:${range===val?'#c7d2fe':'#64748b'}`;

  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <span style="font-size:11px;color:#475569">显示：</span>
      ${['7','30','all'].map(v =>
        `<button onclick="_setDvRange('${v}')" style="${btnStyle(v)}">${v==='7'?'近7天':v==='30'?'近30天':'全部'}</button>`
      ).join('')}
    </div>
    <table style="width:auto;border-collapse:collapse">
      <thead><tr>
        <th style="${thStyle};color:#64748b">日期</th>${headers}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  // 存最新的 series 数据供切换用
  el._collectData = collectData;
  el._qcData = qcData;
  el._labData = labData;
}

function _setDvRange(val) {
  localStorage.setItem('dvDailyRange', val);
  const el = document.getElementById('dvLabChart');
  if (el) renderLabDailyChart(el._collectData, el._qcData, el._labData);
}

function closeDeliveryDetail() {
  document.getElementById('deliveryDetail').style.display = 'none';
}

async function triggerDeliveryRefresh() {
  const btn = document.getElementById('deliveryRefreshBtn');
  btn.disabled = true;
  await fetch('/api/delivery/refresh', {method:'POST'});
  updateDeliveryRefreshingTip(true);
  // 启动轮询
  if (!_deliveryPollTimer) {
    _deliveryPollTimer = setInterval(() => {
      fetch('/api/delivery/data').then(r => r.json()).then(j => {
        _deliveryData = j.projects || {};
        renderDeliveryCards();
        updateDeliveryRefreshingTip(j.refreshing);
        if (!j.refreshing) {
          clearInterval(_deliveryPollTimer);
          _deliveryPollTimer = null;
        }
      });
    }, 30000);
  }
}

// 检查是否管理员，控制账号管理入口显示
fetch('/api/auth/me').then(r => r.json()).then(d => {
  if (d.admin) document.getElementById('accountsLink').style.display = 'block';
});
</script>
